services:
  svcdesk:
    build:
      context: .
      target: application
    ports:
      - "8080:8080"
    environment:
      SVCDESK_TEST_CLOCK: "1"
      SVCDESK_DB: /data/svcdesk.db
    volumes:
      - svcdesk-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
  tests:
    build:
      context: .
      target: tests
    profiles: ["tests"]
    environment:
      SVCDESK_URL: http://svcdesk:8080
    depends_on:
      svcdesk:
        condition: service_healthy
volumes:
  svcdesk-data:
