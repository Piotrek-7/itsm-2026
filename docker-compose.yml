services:
  svcdesk:
    build:
      context: .
      target: application
    ports:
      - "8080:8080"
    environment:
      SVCDESK_TEST_CLOCK: "1"
      SVCDESK_DB: /data/svcdesk.db
      KB_INDEX_URL: http://kb-index:8080
    depends_on:
      - kb-index
    volumes:
      - svcdesk-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
  kb-index:
    image: ghcr.io/swasik/seeded-toxic:2026
    environment:
      SEEDED_TOXIC_LOGIN: "piotrek-7"
    ports:
      - "127.0.0.1:8081:8080"
  prometheus:
    build: ./prometheus
    profiles: ["observability"]
    ports:
      - "127.0.0.1:9090:9090"
  grafana:
    build: ./grafana
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    profiles: ["gap"]
    ports:
      - "0.0.0.0:8474:8474"
      - "0.0.0.0:8666:8666"
  tests:
    build:
      context: .
      target: tests
    profiles: ["tests"]
    environment:
      SVCDESK_URL: http://svcdesk:8080
    depends_on:
      svcdesk:
        condition: service_healthy
volumes:
  svcdesk-data:
